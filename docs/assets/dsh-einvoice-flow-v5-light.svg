<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-einvoice 结构：两条输入通道（OFD 容器：OFD.xml、旧版 Attachs/original_invoice.xml、数电 Tags/CustomTag.xml 的 ObjectRef → Pages/*/Content.xml 文本；以及独立 XML）汇入 invoice.ingest（realpath 白名单、大小闸门、SHA-256、原件 0600、同字节幂等），再由 invoice.parse（ofd-zip-xml@1）归一为八字段、明细行、字段证据与未知字段；之后分两轨：R0 只读轨 query / dedup / check / tax_id_check / code_check，R1 本地写轨 review_queue / record_receipt / redlink / archive / restore。生命周期 received → parsed，回执后 verified 或 quarantined；数据落在 fin_invoice 与 storages/dsh-einvoice，不联网。">
<title>dsh-einvoice: dual-channel confluence, one normalize core, R0 read rail / R1 write rail</title>
